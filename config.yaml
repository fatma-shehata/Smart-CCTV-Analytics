model:
  weights: "yolo11s.pt"
  segmentation_weights: "yolo11n-seg.pt"
  confidence: 0.45
  iou: 0.50
  classes: [0, 2, 3, 5, 7]
  device: "cpu"
  mode: "detection"     # "detection" or "segmentation"

tracker:
  type: "bytetrack.yaml"
  track_buffer: 60


events:
  loitering_seconds: 20
  crowd_threshold: 15
  restricted_zone:
    - [400, 300]
    - [700, 300]
    - [700, 600]
    - [400, 600]
  safe_waiting_zone:         
    - [50, 400]
    - [300, 400]
    - [300, 600]
    - [50, 600]

performance:
  frame_resize_width: 640      
  segmentation_every_n_frames: 5  

output:
  save_annotated_video: true
  report_format: "both"